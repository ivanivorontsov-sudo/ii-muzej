name: Publish AI Museum (Web)

on:
  push:
    branches:
      - main
    paths:
      - "game/**"
      - ".github/workflows/publish-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Godot Web export
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install Godot 4.7.2 and Web export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Verify Godot version
        run: godot --version

      - name: Import project resources
        run: godot --headless --editor --path game --quit

      - name: Run project tests
        run: godot --headless --path game --script res://tests/run_tests.gd

      - name: Export Web build
        run: |
          mkdir -p build/web
          godot --headless --path game --export-release "Web"
          test -s build/web/index.html
          touch build/web/.nojekyll
          echo "Web export files:"
          find build/web -maxdepth 1 -type f -printf '%f (%s bytes)\\n' | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
